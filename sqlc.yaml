version: "2"
sql:
  - schema: 
      - "sql/schema"
      - "sql/sqlc_helpers/fts_definitions.sql"
    queries: "sql/queries"
    engine: "sqlite"
    gen:
      go:
        package: "db"
        out: "internal/db"
        emit_json_tags: true
        emit_prepared_queries: true
        emit_interface: true
        rename:
          physical_bin_pixel: PhysicalBinPixelRecord
          physical_emergency_outcome: PhysicalEmergencyOutcomeRecord
