root = "."
tmp_dir = "tmp"

[build]
  # Build the server directory
  cmd = "go build -tags fts5 -o ./tmp/main ./cmd/server"
  
  # The binary to run
  bin = "./tmp/main"
  
  # Delay in milliseconds after a file change before building.
  # This allows Templ to finish writing all files.
  delay = 1000

  # Ignore these to prevent loops
  exclude_dir = ["assets", "tmp", "vendor", "node_modules", "web/static", ".git"]
  
  # Exclude generated templ files (templ watch handles .templ -> _templ.go)
  # exclude_regex = ["_templ\\.go$"]
  
  # Watch these extensions
  include_ext = ["go"]
  
  # Don't let build errors kill the process
  stop_on_error = true

[log]
  time = true
