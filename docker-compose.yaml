services:
  wledger:
    build: .
    container_name: wledger

    environment:
      # Externally reachable base URL (used for OAuth callback URLs e.g. DigiKey).
      # Must be HTTPS and match the redirect URI registered in the provider app.
      - WLEDGER_PUBLIC_URL=https://storage.localdomain
      # Machine-to-machine API token (Home Assistant + MCP). If set, /api/v1 is
      # mounted and requires this bearer token. Generate one, e.g.
      #   openssl rand -hex 32
      - WLEDGER_API_TOKEN=${WLEDGER_API_TOKEN:-}

    ports:
      # Maps ports in the format "HOST:CONTAINER"
      # 8080 (Left): The port you open on your computer (http://localhost:8080)
      # 8080 (Right): The port the app inside the container is listening on
      - "8090:8080"

    volumes:
      # Maps files in the format "HOST_PATH:CONTAINER_PATH"
      # Persists data so it isn't lost when the container updates or deletes.

      # Map the local './data' folder to the internal '/wledger/data' database folder
      - ./data:/wledger/data

      # Map the local './uploads' folder to where the app stores user uploaded files
      - ./uploads:/wledger/app/uploads

      # Map the local './logs' folder so you can read log files without entering the container
      - ./logs:/wledger/app/logs

    # Restart policy
    restart: unless-stopped

  # MCP server exposing WLEDger actions to LLM agents (Home Assistant
  # conversation agent, Open WebUI, Hermes, Claude Desktop, ...). Talks to the
  # wledger /api/v1 API with the same token. Exposes streamable HTTP on :9100
  # (set MCP_TRANSPORT=stdio only when a client launches the process itself,
  # e.g. Claude Desktop runs it as a command).
  #
  # Authentication: every network MCP request must send
  #   Authorization: Bearer ${WLEDGER_API_TOKEN}
  # The server refuses to start a network transport without a token.
  mcp-server:
    build: .
    container_name: wledger-mcp
    command: ["./mcp-server"]
    environment:
      # Point at the wledger service on the shared docker network.
      - WLEDGER_API_URL=http://wledger:8080
      - WLEDGER_API_TOKEN=${WLEDGER_API_TOKEN:-}
      # streamable HTTP (default in this compose) keeps the process alive and
      # exposes MCP over http://<host>:9100/mcp for Home Assistant / agents.
      - MCP_TRANSPORT=${MCP_TRANSPORT:-http}
      # Bind all interfaces *inside the container* so the published port can
      # reach it. Host exposure is restricted below.
      - MCP_HTTP_ADDR=:9100
      # Optional: comma-separated browser origins allowed to call MCP. Loopback
      # origins are always trusted; requests without an Origin header (normal
      # MCP clients) are allowed. Set this only if a browser-based client must
      # reach the server from another origin.
      - MCP_ALLOWED_ORIGINS=${MCP_ALLOWED_ORIGINS:-}
    ports:
      # Publish to host loopback only by default. To expose MCP to other hosts,
      # put it behind an authenticated HTTPS reverse proxy (recommended) or, if
      # you accept the risk on a trusted network, change this to "9100:9100".
      - "127.0.0.1:9100:9100"
    restart: unless-stopped
