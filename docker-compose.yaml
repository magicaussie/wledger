services:
  wledger:
    build: .
    container_name: wledger

    environment:
      # Externally reachable base URL (used for OAuth callback URLs e.g. DigiKey).
      # Must be HTTPS and match the redirect URI registered in the provider app.
      - WLEDGER_PUBLIC_URL=https://storage.localdomain

    ports:
      # Maps ports in the format "HOST:CONTAINER"
      # 8080 (Left): The port you open on your computer (http://localhost:8080)
      # 8080 (Right): The port the app inside the container is listening on
      - "8090:8080"

    volumes:
      # Maps files in the format "HOST_PATH:CONTAINER_PATH"
      # Persists data so it isn't lost when the container updates or deletes.

      # Map the local './data' folder to the internal '/wledger/data' database folder
      - ./data:/wledger/data

      # Map the local './uploads' folder to where the app stores user uploaded files
      - ./uploads:/wledger/app/uploads

      # Map the local './logs' folder so you can read log files without entering the container
      - ./logs:/wledger/app/logs

    # Restart policy
    # "unless-stopped" means the container will automatically start up if the server reboots
    # or if the app crashes, but NOT if you manually run 'docker-compose down'.
    restart: unless-stopped
